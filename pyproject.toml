[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamguard-cdc"
version = "1.0.0"
description = "CDC stream processor: Postgres WAL -> Debezium -> Kafka -> dedupe/schema-evolution/windowed-aggregation -> ClickHouse"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Only needed to run the *real* production adapters (streamguard/main.py)
# against an actual Redpanda/ClickHouse/Postgres deployment. The unit
# test suite never imports these -- every real adapter lazy-imports its
# client library only when instantiated.
prod = [
    "confluent-kafka>=2.3.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
]
# Only needed for the optional, Docker-backed integration suite under
# tests/integration/, which is skipped by default.
integration = [
    "testcontainers>=4.7.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration"
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["streamguard*"]
