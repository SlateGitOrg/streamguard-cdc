name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      # No Docker daemon, no cluster, no network needed: every unit test
      # runs against the in-memory Kafka/ClickHouse fakes in
      # streamguard/kafka_io.py and streamguard/clickhouse_sink.py.
      - name: Run unit tests
        run: pytest -v --cov=streamguard --cov-report=term-missing

      - name: Run offline end-to-end demo (smoke test)
        run: python3 scripts/run_offline_demo.py

  validate-compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config -q

  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all Python sources
        run: python3 -m py_compile $(find streamguard tests scripts -name '*.py')
